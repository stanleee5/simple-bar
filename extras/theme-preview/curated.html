<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
</head>
<body>
<title>simple-bar 테마 미리보기</title>
<style>
  :root {
    --ground: #eef0f4;
    --surface: #ffffff;
    --ink: #1f242b;
    --muted: #5b6572;
    --line: #d9dee6;
    --accent: #3e6b8f;
    --accent-ink: #ffffff;
    --chip-dark-bg: #2b303a;
    --chip-dark-ink: #cfd6e0;
    --chip-light-bg: #e4e8ee;
    --chip-light-ink: #4a5462;
    --desk-dark-a: #2a2e36;
    --desk-dark-b: #1b1e24;
    --desk-light-a: #dde1e7;
    --desk-light-b: #c9cfd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131519;
      --surface: #1c1f25;
      --ink: #e7eaee;
      --muted: #98a1ad;
      --line: #2c313a;
      --accent: #7fa8c9;
      --accent-ink: #10161c;
      --chip-dark-bg: #262b34;
      --chip-dark-ink: #aeb7c4;
      --chip-light-bg: #d7dce4;
      --chip-light-ink: #39414d;
    }
  }
  :root[data-theme="light"] {
    --ground: #eef0f4; --surface: #ffffff; --ink: #1f242b; --muted: #5b6572;
    --line: #d9dee6; --accent: #3e6b8f; --accent-ink: #ffffff;
    --chip-dark-bg: #2b303a; --chip-dark-ink: #cfd6e0;
    --chip-light-bg: #e4e8ee; --chip-light-ink: #4a5462;
  }
  :root[data-theme="dark"] {
    --ground: #131519; --surface: #1c1f25; --ink: #e7eaee; --muted: #98a1ad;
    --line: #2c313a; --accent: #7fa8c9; --accent-ink: #10161c;
    --chip-dark-bg: #262b34; --chip-dark-ink: #aeb7c4;
    --chip-light-bg: #d7dce4; --chip-light-ink: #39414d;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Monaco, monospace; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .head-inner {
    max-width: 1060px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h1 small { font-weight: 450; color: var(--muted); margin-left: 8px; font-size: 13px; }
  .controls { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button {
    border: 0; background: transparent; color: var(--muted);
    font: 500 13px/1 inherit; font-family: inherit; padding: 7px 13px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.toggle { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  label.toggle input { accent-color: var(--accent); }

  main { max-width: 1060px; margin: 0 auto; padding: 22px 24px 64px; }
  .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  .hint code {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1.5px 6px;
  }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px 18px; margin-bottom: 14px;
  }
  .card.hidden { display: none; }
  .card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .t-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .kind {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px;
  }
  .kind.dark  { background: var(--chip-dark-bg);  color: var(--chip-dark-ink); }
  .kind.light { background: var(--chip-light-bg); color: var(--chip-light-ink); }
  .current {
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 3px 8px; border-radius: 20px;
    background: var(--accent); color: var(--accent-ink);
  }
  .copy {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    border-radius: 7px; padding: 5px 10px; cursor: pointer;
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px;
  }
  .copy:hover { border-color: var(--accent); color: var(--ink); }
  .copy.done { border-color: var(--accent); color: var(--accent); }

  .swatches { display: flex; gap: 4px; margin-bottom: 12px; }
  .sw { width: 22px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(128,128,128,0.25); }

  .desk { border-radius: 9px; padding: 14px 14px 26px; overflow-x: auto; }
  .desk.dark  { background: linear-gradient(135deg, var(--desk-dark-a),  var(--desk-dark-b)); }
  .desk.light { background: linear-gradient(135deg, var(--desk-light-a), var(--desk-light-b)); }

  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-width: 780px; height: 34px; padding: 0 5px;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Monaco, monospace;
    font-size: 11px;
  }
  body.compact .bar { height: 28px; font-size: 10px; }
  .bar .side { display: flex; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 7px; margin-left: 5px; white-space: nowrap; line-height: 1.4;
  }
  body.compact .pill { padding: 2px 6px; }
  .appdot { display: inline-block; width: 9px; height: 9px; border-radius: 2.5px; opacity: 0.75; }
</style>

<header>
  <div class="head-inner">
    <h1>simple-bar 테마 미리보기<small id="count"></small></h1>
    <div class="controls">
      <div class="seg" role="group" aria-label="테마 종류 필터">
        <button data-filter="all" aria-pressed="true">전체</button>
        <button data-filter="dark" aria-pressed="false">Dark</button>
        <button data-filter="light" aria-pressed="false">Light</button>
      </div>
      <label class="toggle"><input type="checkbox" id="compact"> Compact (28px)</label>
    </div>
  </div>
</header>

<main>
  <p class="hint">
    각 미리보기는 현재 켜져 있는 위젯 구성(spaces · process · music · sound · wifi · battery · weather · date · time)을
    해당 테마의 실제 색상 규칙으로 재현한 것입니다. 오른쪽 버튼을 누르면 설정값이 복사됩니다 —
    <code>~/.simplebarrc</code>의 <code>themes.lightTheme</code> / <code>themes.darkTheme</code>에 붙여넣으면 적용됩니다
    (바에서 ⌘ , 설정 패널로도 변경 가능).
  </p>
  <div id="list"></div>
</main>

<script>

#7fdbca","foreground":"#d2dee7","barRadius":"3px","itemRadius":"2px"},"night-shift-dark":{"name":"Night Shift Dark","kind":"dark","main":"#1b222d","mainAlt":"#98a8c5","minor":"#39465e","red":"#e78482","green":"#8fc8BB","yellow":"#ffd484","orange":"#ffb374","blue":"#6db3cE","magenta":"#ad82cB","cyan":"#7eddde","foreground":"#fff","barRadius":"6px","itemRadius":"5px"},"night-shift-light":{"name":"Night Shift Light","kind":"light","main":"#fff","mainAlt":"#98a8c5","minor":"#f5f5f5","red":"#e78482","green":"#8fc8bb","yellow":"#d1ab66","orange":"#ffb374","blue":"#6db3ce","magenta":"#ad82cb","cyan":"#2fc2c3","foreground":"#1b222d","barRadius":"6px","itemRadius":"5px"},"nightfox-dark":{"name":"Nightfox Dark","kind":"dark","main":"#192330","mainAlt":"#131a24","minor":"#29394f","red":"#c94f6d","green":"#81b29a","yellow":"#dbc074","orange":"#f4a261","blue":"#719cd6","magenta":"#9d79d6","cyan":"#63cdcf","foreground":"#cdcecf","barRadius":"7px","itemRadius":"5px"},"nightfox-light":{"name":"Nightfox Light","kind":"light","main":"#f6f2ee","mainAlt":"#e4dcd4","minor":"#d3c7bb","red":"#a5222f","green":"#396847","yellow":"#AC5402","orange":"#955f61","blue":"#2848a9","magenta":"#6e33ce","cyan":"#287980","foreground":"#3d2b5a","barRadius":"7px","itemRadius":"5px"},"nord":{"name":"Nord","kind":"dark","main":"#3b4252","mainAlt":"#eceef4","minor":"#4c566a","red":"#bf616a","green":"#a3be8c","yellow":"#ebcb8b","orange":"#d08770","blue":"#81a1c1","magenta":"#b48ead","cyan":"#88c0d0","foreground":"#d8dee9","barRadius":"16px","itemRadius":"14px"},"one-dark":{"name":"One Dark","kind":"dark","main":"#21252b","mainAlt":"#e6e6e6","minor":"#323842","red":"#e05561","green":"#8cc265","yellow":"#d18f52","orange":"#ffb374","blue":"#6db3ce","magenta":"#c162de","cyan":"#42b3c2","foreground":"#abb2bf","barRadius":"16px","itemRadius":"20px"},"one-light":{"name":"One Light","kind":"light","main":"#f5f5f5","mainAlt":"#21252b","minor":"#fff","red":"#e05561","green":"#8cc265","yellow":"#d18f52","orange":"#FFB   const CURRENT = ["NightShiftLight", "NightShiftDark"];

  const configName = (name) => name.replace(/[^a-zA-Z0-9]/g, "");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  function pill(bg, fg, text, extraStyle = "", radius = "") {
    return `<span class="pill" style="background:${bg};color:${fg};border-radius:${radius};${extraStyle}">${text}</span>`;
  }

  function barHTML(t) {
    const r = t.itemRadius || "4px";
    const dot = `<span class="appdot" style="background:${t.foreground}"></span>`;
    // spaces: 첫 번째가 포커스된 space (bg=foreground, text=minor)
    const spaces =
      pill(t.foreground, t.minor, "1", "font-weight:700", r) +
      pill(t.minor, t.foreground, `2 ${dot}${dot}`, "", r) +
      pill(t.minor, t.foreground, `3 ${dot}`, "", r) +
      pill(t.minor, t.foreground, "4", "", r);
    const process = pill(t.minor, t.foreground, "&#xFF5E; Ghostty", "opacity:0.95", r);
    const right =
      pill(t.green,  t.main, "&#9835; NewJeans &#8211; ETA", "", r) +
      pill(t.blue,   t.main, "&#9836; 45%", "", r) +
      pill(t.red,    t.main, "&#9776; Wi-Fi", "", r) +
      pill(t.magenta,t.main, "&#9646; 87%", "", r) +
      pill(t.minor,  t.foreground, "Magok, 27&deg;C", "", r) +
      pill(t.cyan,   t.main, "Sun 6 Jul", "", r) +
      pill(t.yellow, t.main, "14:32", "", r);
    return `<div class="bar" style="background:${t.main};border-radius:${t.barRadius || "4px"}">
      <div class="side">${spaces}${process}</div>
      <div class="side">${right}</div>
    </div>`;
  }

  function card(slug, t) {
    const cfg = configName(t.name);
    const isCurrent = CURRENT.includes(cfg);
    const swatchKeys = ["main", "mainAlt", "minor", "red", "green", "yellow", "orange", "blue", "magenta", "cyan", "foreground"];
    const swatches = swatchKeys
      .map((k) => `<span class="sw" style="background:${t[k]}" title="${k}: ${t[k]}"></span>`)
      .join("");
    return `<section class="card" data-kind="${t.kind}">
      <div class="card-head">
        <span class="t-name">${esc(t.name)}</span>
        <span class="kind ${t.kind}">${t.kind}</span>
        ${isCurrent ? '<span class="current">현재 사용 중</span>' : ""}
        <button class="copy" data-cfg="${cfg}" title='"${cfg}" 복사'>${cfg} &#x2398;</button>
      </div>
      <div class="swatches">${swatches}</div>
      <div class="desk ${t.kind}">${barHTML(t)}</div>
    </section>`;
  }

  const list = document.getElementById("list");
  list.innerHTML = Object.entries(THEMES).map(([slug, t]) => card(slug, t)).join("");

  const cards = [...document.querySelectorAll(".card")];
  const countEl = document.getElementById("count");
  const updateCount = () => {
    const n = cards.filter((c) => !c.classList.contains("hidden")).length;
    countEl.textContent = `${n}개 테마`;
  };

  document.querySelectorAll(".seg button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", b === btn));
      const f = btn.dataset.filter;
      cards.forEach((c) => c.classList.toggle("hidden", f !== "all" && c.dataset.kind !== f));
      updateCount();
    });
  });
  updateCount();

  document.getElementById("compact").addEventListener("change", (e) => {
    document.body.classList.toggle("compact", e.target.checked);
  });

  list.addEventListener("click", async (e) => {
    const btn = e.target.closest(".copy");
    if (!btn) return;
    try {
      await navigator.clipboard.writeText(btn.dataset.cfg);
      const orig = btn.innerHTML;
      btn.classList.add("done");
      btn.innerHTML = "복사됨 &#x2713;";
      setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = orig; }, 1400);
    } catch {}
  });
</script>

</body>
</html>
