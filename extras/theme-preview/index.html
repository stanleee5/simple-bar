<title>simple-bar 테마 라이브러리</title>
<style>
  :root {
    --ground: #faf5f7; --surface: #fffdfe; --ink: #2b2228; --muted: #7d6b74;
    --line: #eadfe5; --accent: #c94f7c; --accent-ink: #ffffff;
    --chip-dark-bg: #332a30; --chip-dark-ink: #ddccd5;
    --chip-light-bg: #f2e6ec; --chip-light-ink: #6d5561;
    --desk-dark-a: #2e2630; --desk-dark-b: #1d171f;
    --desk-light-a: #ecdfe6; --desk-light-b: #d9c8d2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #171216; --surface: #201a1f; --ink: #f0e6eb; --muted: #a08e98;
      --line: #362c33; --accent: #e884ab; --accent-ink: #23141b;
      --chip-dark-bg: #2c242a; --chip-dark-ink: #c4b2bb;
      --chip-light-bg: #e7d8df; --chip-light-ink: #52404a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  header { border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--ground); z-index: 2; }
  .head-inner { max-width: 1020px; margin: 0 auto; padding: 14px 24px 0; }
  h1 { font-size: 18px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  #helper-status { font-size: 12.5px; margin: 5px 0 0; }
  #helper-status .on  { color: #3d9a6c; font-weight: 600; }
  #helper-status .off { color: var(--accent); font-weight: 600; }
  #helper-status code { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
  nav.tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; padding-bottom: 10px; }
  .tab-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 12px;
    background: var(--surface); color: var(--muted);
  }
  .tab-btn .n { opacity: 0.6; font-weight: 500; margin-left: 3px; }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tab-btn.active .n { opacity: 0.8; }
  main { max-width: 1020px; margin: 0 auto; padding: 18px 24px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px 18px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 4px; }
  .t-name { font-size: 15.5px; font-weight: 650; letter-spacing: -0.01em; }
  .t-key { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
  .kind, .origin { font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; }
  .kind.dark  { background: var(--chip-dark-bg);  color: var(--chip-dark-ink); }
  .kind.light { background: var(--chip-light-bg); color: var(--chip-light-ink); }
  .origin { background: transparent; border: 1px solid var(--line); color: var(--muted);
    text-transform: none; letter-spacing: 0.02em; }
  .origin.custom { border-color: var(--accent); color: var(--accent); }
  .desc { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; max-width: 68ch; }
  .swatches { display: flex; gap: 4px; margin-bottom: 12px; }
  .sw { width: 24px; height: 15px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(128,128,128,0.3); }
  .desk { border-radius: 9px; padding: 14px 14px 24px; overflow-x: auto; }
  .desk.dark  { background: linear-gradient(135deg, var(--desk-dark-a),  var(--desk-dark-b)); }
  .desk.light { background: linear-gradient(135deg, var(--desk-light-a), var(--desk-light-b)); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-width: 780px; height: 34px; padding: 0 5px;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Monaco, monospace; font-size: 11px; }
  .bar .side { display: flex; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 7px; margin-left: 5px; white-space: nowrap; line-height: 1.4; }
  .appdot { display: inline-block; width: 9px; height: 9px; border-radius: 2.5px; opacity: 0.75; }
  .apply-btn {
    margin-left: auto; font-family: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.02em; padding: 5px 14px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
  }
  .apply-btn:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
  .apply-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .apply-btn.busy { opacity: 0.6; cursor: wait; }
  .tab-note { color: var(--muted); font-size: 13px; margin: 2px 0 16px; }
</style>

<header>
  <div class="head-inner">
    <h1>simple-bar 테마 라이브러리 <span style="color:var(--accent)" id="n-total"></span></h1>
    <p class="sub">전 테마 설치 완료 — 카드의 <b>적용</b> 버튼을 누르면 1&ndash;2초 뒤 실제 메뉴바가 바뀝니다.</p>
    <p id="helper-status">헬퍼 확인 중&hellip;</p>
    <nav class="tabs" id="tabbar"></nav>
  </div>
</header>

<main id="list"></main>

  const TABS = ["기본","커스텀","핑크","레트로 터미널/CRT","미니멀/모노크롬"];

  const HELPER = "http://localhost:7778";
  let helperOnline = false;
  let currentLight = null;
  let currentDark = null;
  let activeTab = decodeURIComponent(location.hash.slice(1)) || TABS[0];
  if (!TABS.includes(activeTab)) activeTab = TABS[0];

  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  function pill(bg, fg, text, extraStyle = "", radius = "") {
    return `<span class="pill" style="background:${bg};color:${fg};border-radius:${radius};${extraStyle}">${text}</span>`;
  }

  function barHTML(t) {
    const r = t.itemRadius;
    const dot = `<span class="appdot" style="background:${t.foreground}"></span>`;
    const spaces =
      pill(t.foreground, t.minor, "1", "font-weight:700", r) +
      pill(t.minor, t.foreground, `2 ${dot}`, "", r);
    const process = pill(t.minor, t.foreground, "&#x1F47B; Ghostty / &#x2733; Simple-bar", "opacity:0.95", r);
    const right =
      pill(t.green,   t.main, "&#9835; NewJeans &#8211; ETA", "", r) +
      pill(t.blue,    t.main, "&#9836; 45%", "", r) +
      pill(t.red,     t.main, "&#9776; Wi-Fi", "", r) +
      pill(t.magenta, t.main, "&#9646; 87%", "", r) +
      pill(t.minor,   t.foreground, "Magok, 27&deg;C", "", r) +
      pill(t.cyan,    t.main, "Mon 7 Jul", "", r) +
      pill(t.yellow,  t.main, "16:45", "", r);
    return `<div class="bar" style="background:${t.main};border-radius:${t.barRadius}">
      <div class="side">${spaces}${process}</div>
      <div class="side">${right}</div>
    </div>`;
  }

  function card(t) {
    const swKeys = ["main", "minor", "magenta", "red", "orange", "yellow", "green", "cyan", "blue", "foreground"];
    const sws = swKeys.map((k) => `<span class="sw" style="background:${t[k]}" title="${k}: ${t[k]}"></span>`).join("");
    const originCls = (t.origin || "").startsWith("커스텀") ? "origin custom" : "origin";
    const isLight = t.key === currentLight;
    const isDark = t.key === currentDark;
    let badge = "", button = "";
    if (isLight || isDark) {
      const label = isLight && isDark ? "적용됨" : isLight ? "적용됨 · light" : "적용됨 · dark";
      badge = `<span class="origin" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">${label}</span>`;
    } else {
      button = `<button class="apply-btn" data-key="${t.key}" ${helperOnline ? "" : "disabled"}>적용</button>`;
    }
    const desc = t.desc ? `<p class="desc">${t.desc}</p>` : "";
    return `<section class="card">
      <div class="card-head">
        <span class="t-name">${esc(t.name)}</span>
        <span class="t-key">${esc(t.key)}</span>
        <span class="kind ${t.kind}">${t.kind}</span>
        <span class="${originCls}">${esc(t.origin || "")}</span>${badge}${button}
      </div>
      ${desc}
      <div class="swatches">${sws}</div>
      <div class="desk ${t.kind}">${barHTML(t)}</div>
    </section>`;
  }

  function renderTabs() {
    document.getElementById("tabbar").innerHTML = TABS.map((tab) => {
      const n = THEMES.filter((t) => t.tab === tab).length;
      return `<button class="tab-btn${tab === activeTab ? " active" : ""}" data-tab="${tab}">${tab}<span class="n">${n}</span></button>`;
    }).join("");
  }

  function render() {
    renderTabs();
    const items = THEMES.filter((t) => t.tab === activeTab);
    const darks = items.filter((t) => t.kind === "dark").length;
    document.getElementById("list").innerHTML =
      `<p class="tab-note">${activeTab} — ${items.length}개 (dark ${darks} · light ${items.length - darks})</p>` +
      items.map(card).join("");
    document.getElementById("n-total").textContent = THEMES.length;
  }

  function setHelperStatus(online) {
    helperOnline = online;
    const cur = currentLight === currentDark ? currentLight : `${currentLight}(light) / ${currentDark}(dark)`;
    document.getElementById("helper-status").innerHTML = online
      ? `<span class="on">&#9679; 헬퍼 연결됨</span> — 현재 적용: <code>${cur ?? "?"}</code>`
      : `<span class="off">&#9675; 헬퍼(:7778) 응답 없음</span> — 버튼 비활성.
         <code>launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.local.simple-bar-theme-helper.plist</code>`;
  }

  async function refreshStatus() {
    try {
      const r = await fetch(`${HELPER}/status`);
      const s = await r.json();
      if (s.ok) { currentLight = s.lightTheme; currentDark = s.darkTheme; setHelperStatus(true); }
      else setHelperStatus(false);
    } catch { setHelperStatus(false); }
    render();
  }

  document.getElementById("tabbar").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    activeTab = btn.dataset.tab;
    history.replaceState(null, "", "#" + encodeURIComponent(activeTab));
    render();
    window.scrollTo(0, 0);
  });

  document.getElementById("list").addEventListener("click", async (e) => {
    const btn = e.target.closest(".apply-btn");
    if (!btn || btn.disabled) return;
    const key = btn.dataset.key;
    btn.classList.add("busy");
    btn.disabled = true;
    btn.textContent = "적용 중…";
    try {
      const r = await fetch(`${HELPER}/apply?theme=${encodeURIComponent(key)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      const result = await r.json();
      if (!result.ok) throw new Error(result.error || "unknown error");
      currentLight = key; currentDark = key;
      setHelperStatus(true);
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    } catch (err) {
      setHelperStatus(false);
      alert(`적용 실패: ${err.message}\n헬퍼(localhost:7778)가 떠 있는지 확인하세요.`);
      render();
    }
  });

  render();
  refreshStatus();
</script>
